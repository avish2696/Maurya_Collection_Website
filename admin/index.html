<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Maurya Collection</title>
  <link rel="icon" href="../assets/favicon/maurya-collection-icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 40%, #1b0409 0%, #0a0102 70%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.1);
    }
    .login-logo {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      margin-bottom: 36px;
    }
    .login-logo img { width: 64px; height: 64px; object-fit: contain; }
    .login-logo h1 {
      font-size: 1.1rem; font-weight: 700; color: #fff;
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    .login-logo span {
      font-size: 0.7rem; letter-spacing: 0.22em; color: #c9a84c;
      text-transform: uppercase; font-weight: 600;
    }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.72rem; font-weight: 700; color: #c9a84c;
      text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; }
    input {
      width: 100%; height: 48px; padding: 0 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: #fff; font-size: 0.9rem;
      font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #c9a84c; }
    input::placeholder { color: rgba(255,255,255,0.3); }
    .login-btn {
      width: 100%; height: 50px; margin-top: 8px;
      background: linear-gradient(135deg, #8B0020, #c9a84c);
      border: none; border-radius: 12px; color: #fff;
      font-size: 0.9rem; font-weight: 700; letter-spacing: 0.08em;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
      font-family: inherit;
    }
    .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .error-msg {
      display: none; margin-top: 14px; padding: 12px 16px;
      background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3);
      border-radius: 10px; color: #fca5a5; font-size: 0.82rem; text-align: center;
    }
    .error-msg.show { display: block; }
    .back-link {
      display: block; text-align: center; margin-top: 20px;
      color: rgba(255,255,255,0.4); font-size: 0.78rem;
      text-decoration: none; transition: color 0.2s;
    }
    .back-link:hover { color: #c9a84c; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/logo/maurya-collection-icon.png" alt="Maurya Collection" onerror="this.style.display='none'" />
      <h1>Maurya Collection</h1>
      <span>Admin Portal</span>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Admin Email / ID</label>
        <input type="email" id="username" placeholder="admin@yourdomain.com" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn">Sign In to Dashboard →</button>
      <div class="error-msg" id="errMsg">Invalid Admin ID or Password</div>
    </form>
    <a href="../index.html" class="back-link">← Back to Website</a>
  </div>

  <script>
    // Clear any past session when opening the login page so login is always required
    sessionStorage.removeItem('mc_admin_auth');
    sessionStorage.removeItem('mc_admin_user');
    localStorage.removeItem('mc_admin_auth');

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim().toLowerCase();
      const p = document.getElementById('password').value.trim();

      // Strict Admin Authentication Check
      const validUsers = ['avishkar.kumar555@gmail.com', 'admin@mauryacollection.com', 'admin@topsun.com'];
      const validPass = 'Maurya@2026';

      if (validUsers.includes(u) && p === validPass) {
        sessionStorage.setItem('mc_admin_auth', 'true');
        sessionStorage.setItem('mc_admin_user', u);
        window.location.href = '/admin/dashboard.html';
      } else {
        document.getElementById('errMsg').classList.add('show');
      }
    });
  </script>
</body>
</html>
